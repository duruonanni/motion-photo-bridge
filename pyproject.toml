[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-photo-bridge"
version = "0.2.2"
description = "Turn dual-file live photos (vivo/OPPO style JPG + MP4) into standard Android Motion Photos and wire them into Immich."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "duruonanni" }]
keywords = ["motion-photo", "live-photo", "immich", "vivo", "android", "jpeg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
# No runtime dependencies: the merger is vendored under
# motion_photo_bridge/_vendor (MIT), so installs need no git and no network
# beyond PyPI.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mpb = "motion_photo_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["motion_photo_bridge*"]

[tool.setuptools.package-data]
"motion_photo_bridge._vendor" = ["NOTICE.md", "vivo_motion_photo/LICENSE"]
